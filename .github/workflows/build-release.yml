- name: Prepare APK Asset
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Mehfil-E-Nihari.apk

      - name: Create Release with APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mehfil-E-Nihari.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.event.inputs.create_tag || github.ref_name }}
          name: "Release ${{ github.event.inputs.create_tag || github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
